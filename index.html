<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080604">
<title>diner Zen | BAR & DINING</title>
<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:#050403;color:#fff;font-family:"Times New Roman","Yu Mincho",serif}
.hero{position:relative;height:100svh;min-height:620px;overflow:hidden}
.slide{position:absolute;inset:0;background:center/cover no-repeat;opacity:0;transform:scale(1.04);transition:opacity 1.8s ease,transform 7s ease}
.slide.active{opacity:1;transform:scale(1)}
.slide:after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.25),transparent 45%,rgba(0,0,0,.72))}
.heroContent{position:absolute;z-index:3;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:0 20px calc(42px + env(safe-area-inset-bottom));text-align:center}
.brand{margin-bottom:18px;text-shadow:0 3px 18px #000}
.brand small{display:block;font-size:18px;letter-spacing:.3em;margin-left:.3em}
.brand strong{display:block;font-size:clamp(62px,19vw,100px);line-height:.82;font-style:italic}
.enter{width:min(230px,72vw);height:54px;border:1px solid rgba(255,211,132,.9);display:flex;align-items:center;justify-content:center;color:#fff;text-decoration:none;letter-spacing:.3em;background:rgba(0,0,0,.38);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.enter:active{transform:scale(.97)}
.dots{display:flex;gap:8px;margin-top:19px}
.dot{width:7px;height:7px;border-radius:10px;background:#777}
.dot.on{width:25px;background:#fff}
.scroll{position:absolute;z-index:4;right:15px;top:20px;writing-mode:vertical-rl;font-size:10px;letter-spacing:.25em;opacity:.65}

.content{background:#080604}
.imageSection{width:100%;line-height:0}
.imageSection img{display:block;width:100%;height:auto}
.back{display:block;text-align:center;padding:28px 20px 50px;color:#d9b36c;text-decoration:none;letter-spacing:.18em;font-size:13px;background:#080604}
</style>

<style>
.access{
  background:
    radial-gradient(circle at 50% 0,rgba(155,91,31,.22),transparent 42%),
    #080604;
  border-top:1px solid rgba(216,171,91,.35);
  padding:72px 18px 80px;
}
.access-inner{max-width:620px;margin:auto;text-align:center}
.access-kicker{font-size:11px;letter-spacing:.42em;color:#cda15a;margin-bottom:10px}
.access h2{
  margin:0;
  font-size:46px;
  font-weight:normal;
  letter-spacing:.16em;
}
.access-sub{
  color:#d9b36c;
  font-size:15px;
  letter-spacing:.18em;
  margin:7px 0 30px;
}
.access-card{
  border:1px solid rgba(214,163,75,.75);
  background:rgba(0,0,0,.42);
  box-shadow:0 0 25px rgba(0,0,0,.45);
}
.access-item{
  padding:23px 15px;
  border-bottom:1px solid rgba(214,163,75,.4);
}
.access-item:last-child{border-bottom:0}
.access-label{
  display:block;
  color:#d9a94f;
  font-size:11px;
  letter-spacing:.25em;
  margin-bottom:8px;
}
.access-item strong{
  display:block;
  font-size:17px;
  font-weight:normal;
  line-height:1.75;
}
.access-item small{
  display:block;
  color:rgba(255,255,255,.55);
  margin-top:6px;
  font-size:11px;
}
.map-placeholder{
  margin:28px 0;
  min-height:180px;
  border:1px solid rgba(214,163,75,.55);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  background:
    linear-gradient(rgba(0,0,0,.58),rgba(0,0,0,.75)),
    repeating-linear-gradient(45deg,rgba(190,145,65,.08) 0 1px,transparent 1px 16px);
}
.map-placeholder span{font-size:31px;letter-spacing:.2em}
.map-placeholder small{margin-top:10px;color:#bca47c}
.contact-button{
  display:inline-flex;
  min-width:180px;
  height:48px;
  align-items:center;
  justify-content:center;
  border:1px solid #d7ad61;
  color:#fff;
  text-decoration:none;
  letter-spacing:.2em;
  background:rgba(80,45,12,.25);
}
</style>

</head>
<body>

<section class="hero" id="top">
  <div class="slide active" style="background-image:url('images/door.png')"></div>
  <div class="slide" style="background-image:url('images/bar.png')"></div>
  <div class="scroll">DINER ZEN</div>
  <div class="heroContent">
    <div class="brand"><small>diner</small><strong>Zen</strong></div>
    <a class="enter" href="#inside">ENTER</a>
    <div class="dots"><span class="dot on"></span><span class="dot"></span></div>
  </div>
</section>

<main id="inside" class="content">
  <!-- ENTER後：今回追加されたMENU画像 -->
  <section class="imageSection">
    <img src="images/menu.png" alt="diner Zen MENU">
  </section>

  <!-- その下に今回追加された色紙・店内画像 -->
  <section class="imageSection">
    <img src="images/autograph.png" alt="diner Zen 店内の色紙">
  </section>


  <!-- ACCESS / HOURS -->
  <section class="access">
    <div class="access-inner">
      <div class="access-kicker">DINER ZEN</div>
      <h2>ACCESS</h2>
      <div class="access-sub">アクセス・営業時間</div>

      <div class="access-card">
        <div class="access-item">
          <span class="access-label">ADDRESS</span>
          <strong>東京都<br>中野駅周辺</strong>
        </div>

        <div class="access-item">
          <span class="access-label">OPEN</span>
          <strong>21:00 ～ 朝方</strong>
          <small>※営業時間は変更になる場合があります</small>
        </div>

        <div class="access-item">
          <span class="access-label">CLOSED</span>
          <strong>不定期</strong>
        </div>

        <div class="access-item">
          <span class="access-label">ACCESS</span>
          <strong>中野駅周辺</strong>
          <small>当店は隠れ家的な店舗ですので、<br>お電話で場所をご案内します。</small>
        </div>

        <div class="access-item">
          <span class="access-label">PHONE</span>
          <strong>〇〇〇</strong>
          <small>ご来店の際はお電話ください。</small>
        </div>
      </div>

      <div class="map-placeholder">
        <span>MAP</span>
        <small>Google Mapsをここに設置できます</small>
      </div>

      <a class="contact-button" href="#top">TOPへ戻る</a>
    </div>
  </section>

  <a class="back" href="#top">↑ TOP</a>
</main>

<script>
const slides=document.querySelectorAll('.slide');
const dots=document.querySelectorAll('.dot');
let n=0;
setInterval(()=>{
  slides[n].classList.remove('active'); dots[n].classList.remove('on');
  n=(n+1)%slides.length;
  slides[n].classList.add('active'); dots[n].classList.add('on');
},5000);
</script>
</body>
</html>
